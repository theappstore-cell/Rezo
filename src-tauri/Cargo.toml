[package]
name = "rezo"
version = "0.5.0"
description = "Real-time multi-room audio streaming from a Windows PC to Sonos, UPnP/DLNA, native receivers and web browsers"
authors = ["theappstore-cell"]
license = "GPL-3.0-only"
repository = "https://github.com/theappstore-cell/Rezo"
edition = "2021"
rust-version = "1.90"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
console = []

[lib]
name = "rezo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"

rtrb = "0.4"
crossbeam-channel = "0.5"
opus = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
futures-util = "0.3"
bytes = "1"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
socket2 = "0.6"
if-addrs = "0.15"
mdns-sd = "0.22"

qrcode = { version = "0.15", default-features = false, features = ["svg"] }
base64 = "0.22"
sha2 = "0.10"
png = "0.18"

[target.'cfg(not(windows))'.dependencies]
cpal = "0.18"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "s"

[profile.dev]
opt-level = 1

[profile.dev.package.rezo]
opt-level = 3
