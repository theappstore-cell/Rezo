name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish as a draft release (for example v0.2.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  LIBOPUS_STATIC: "1"
  LIBOPUS_NO_PKG: "1"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build app and installer
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=rezo"
          npx tauri build --target ${{ matrix.target }} --bundles nsis
      - name: Build receiver
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=rezo"
          cargo build --release --locked --target ${{ matrix.target }} --manifest-path tools/rezo-recv/Cargo.toml
      - name: Collect files
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe "out/Rezo-${v}-windows-${{ matrix.arch }}-setup.exe"
          cp src-tauri/target/${{ matrix.target }}/release/Rezo.exe "out/Rezo-${v}-windows-${{ matrix.arch }}-portable.exe"
          cp tools/rezo-recv/target/${{ matrix.target }}/release/rezo-recv.exe "out/rezo-recv-${v}-windows-${{ matrix.arch }}.exe"
          ls -l out
      - name: Sign (only when a code-signing certificate is configured)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          foreach ($f in Get-ChildItem out\*.exe) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Remove-Item $pfx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build app (Apple Silicon + Intel)
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=rezo"
          # Developer ID signing and notarization only when the secrets exist; otherwise the bundle is ad-hoc signed.
          if [ -n "$S_APPLE_CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$S_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$S_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$S_APPLE_SIGNING_IDENTITY" APPLE_ID="$S_APPLE_ID"
            export APPLE_PASSWORD="$S_APPLE_PASSWORD" APPLE_TEAM_ID="$S_APPLE_TEAM_ID"
          fi
          npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Build receiver (universal)
        run: |
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=rezo"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target $t --manifest-path tools/rezo-recv/Cargo.toml
          done
      - name: Collect files
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Rezo-${v}-macos-universal.dmg"
          lipo -create -output "out/rezo-recv-${v}-macos-universal" \
            tools/rezo-recv/target/aarch64-apple-darwin/release/rezo-recv \
            tools/rezo-recv/target/x86_64-apple-darwin/release/rezo-recv
          lipo -info "out/rezo-recv-${v}-macos-universal"
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: out/*
          if-no-files-found: error

  publish:
    name: Checksums, provenance, SBOM, draft release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --override-filename rezo-engine.cdx
          cargo cyclonedx --manifest-path tools/rezo-recv/Cargo.toml --format json --override-filename rezo-recv.cdx
          cp src-tauri/rezo-engine.cdx.json tools/rezo-recv/rezo-recv.cdx.json out/
      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          cat > notes.md <<EOF
          ## Downloads

          | File | Platform |
          |---|---|
          | \`Rezo-${v}-windows-x64-setup.exe\` | Windows 10/11, Intel/AMD: installer |
          | \`Rezo-${v}-windows-arm64-setup.exe\` | Windows 11 on ARM: installer |
          | \`Rezo-${v}-windows-*-portable.exe\` | Windows: single executable, nothing to install |
          | \`Rezo-${v}-macos-universal.dmg\` | macOS 11+, Apple Silicon and Intel |
          | \`rezo-recv-${v}-*\` | Native receiver for another computer |

          ## Verify what you downloaded

          Every file was built by GitHub Actions from the tagged source of this repository, nowhere else.

          - Provenance: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`
          - Checksum: compare with \`SHA256SUMS.txt\` (\`Get-FileHash <file>\` on Windows, \`shasum -a 256 <file>\` on macOS).
          - Dependencies: \`rezo-engine.cdx.json\` and \`rezo-recv.cdx.json\` (CycloneDX SBOM).

          The files are not code-signed yet: Windows SmartScreen may warn ("More info" > "Run anyway"); on macOS, try to open the app once, then click "Open Anyway" in System Settings > Privacy & Security.
          EOF
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Rezo ${v}" --notes-file notes.md
