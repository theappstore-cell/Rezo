[package]
name = "rezo-recv"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Reference native Rezo receiver: Opus over UDP/RTP to the local sound card (Windows, macOS, Linux)"
authors = ["theappstore-cell"]
license = "GPL-3.0-only"
repository = "https://github.com/theappstore-cell/Rezo"

[dependencies]
anyhow = "1"
cpal = "0.18"
mdns-sd = "0.22"
opus = "0.4"
rtrb = "0.4"
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = true
strip = true
