[package]
name = "rezo-recv"
version = "0.2.0"
edition = "2021"
description = "Reference native Rezo receiver: Opus over UDP/RTP to the local sound card (Windows, macOS, Linux)"
authors = ["theappstore-cell"]
license = "GPL-3.0-only"
repository = "https://github.com/theappstore-cell/Rezo"

[dependencies]
anyhow = "1"
cpal = "0.15"
mdns-sd = "0.11"
opus = "0.3"
rtrb = "0.4"
socket2 = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
